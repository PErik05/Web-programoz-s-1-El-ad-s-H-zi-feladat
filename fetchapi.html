<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web programozás-1 | Fetch API CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Web programozás-1 Előadás Házi feladat</h1>
    </header>

    <nav>
        <a href="index.html">Főoldal</a>
        <a href="javascript.html">JavaScript CRUD</a>
        <a href="react.html">React CRUD</a>
        <a href="spa.html">SPA App</a>
        <a href="fetchapi.html">Fetch API</a>
        <a href="axios.html">Axios</a>
        <a href="oojs.html">OOJS</a>
    </nav>

    <main>
        <div class="crud-card">
            <h2>NB1 Csapatok</h2>
            <form id="teamForm">
                <input type="hidden" id="teamId">
                
                <div class="form-group">
                    <label for="csapatnev">Csapat neve:</label>
                    <input type="text" id="csapatnev" placeholder="Adja meg a csapat nevét" required>
                </div>
                <button type="submit" id="saveBtn" class="btn-add">Hozzáadás</button>
                <button type="button" id="cancelBtn" class="btn-cancel" style="display:none;" onclick="resetForm()">Mégse</button>
            </form>

            <table id="teamTable">
                <thead><tr><th>ID</th><th>Csapatnév</th><th>Műveletek</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <footer>
        <p><strong>Készítette:</strong></p>
        <p>Tóth Bence Gábor - BFRL41</p>
        <p>Posváncz Erik Attila - BPN12N</p>
    </footer>

    <script>
        const tableBody = document.querySelector('#teamTable tbody');
        const form = document.getElementById('teamForm');

        function loadTeams() {
            fetch('api.php').then(r => r.json()).then(data => {
                tableBody.innerHTML = data.map(team => `
                    <tr>
                        <td>${team.id}</td>
                        <td>${team.csapatnev}</td>
                        <td>
                            <button class="btn-edit" onclick="editTeam(${team.id}, '${team.csapatnev}')">Szerkesztés</button>
                            <button class="btn-delete" onclick="deleteTeam(${team.id})">Törlés</button>
                        </td>
                    </tr>
                `).join('');
            });
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            const id = document.getElementById('teamId').value;
            const csapatnev = document.getElementById('csapatnev').value;
            const method = id ? 'PUT' : 'POST';
            
            fetch('api.php', {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, csapatnev })
            }).then(() => { resetForm(); loadTeams(); });
        });

        function deleteTeam(id) {
            if(confirm('Biztosan törlöd?')) {
                fetch('api.php', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                }).then(loadTeams);
            }
        }

        function editTeam(id, name) {
            document.getElementById('teamId').value = id;
            document.getElementById('csapatnev').value = name;
            document.getElementById('saveBtn').textContent = 'Módosítás';
            document.getElementById('cancelBtn').style.display = 'inline-block';
        }

        function resetForm() {
            form.reset();
            document.getElementById('teamId').value = '';
            document.getElementById('saveBtn').textContent = 'Hozzáadás';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        loadTeams();
    </script>
</body>
</html>
